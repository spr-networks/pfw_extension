version: '3.4'

x-logging:
  &default-logging
  driver: journald

x-labels:
  &default-labels
  org.supernetworks.ci: ${CI:-false}

services:
  pfw:
    container_name: superpfw
    image: ghcr.io/spr-networks/pfw_extension_pfw
    build: .
    network_mode: host
    privileged: true
    logging: *default-logging
    labels: *default-labels
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ../../../state/plugins/pfw:/state/plugins/pfw
      - ../../../configs/base:/configs/base
      - ../../../configs/pfw:/configs/pfw
